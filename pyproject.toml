[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "legacy-music-ai"
version = "0.1.0"
description = "Authorization-first orchestration for local, multi-artist AI music generation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Legacy Music AI contributors" },
]
dependencies = [
    "imageio-ffmpeg>=0.6,<1",
    "numpy>=2.4,<3",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.2,<7",
    "rich>=14.2,<15",
    "soundfile>=0.13.1,<1",
    "typer>=0.20,<1",
]

[project.scripts]
legacy-music = "legacy_music.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_music"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["legacy_music"]
